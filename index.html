<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portofolio Desain Grafis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-blue-50 text-gray-800">

  <!-- Header -->
  <header class="bg-blue-600 text-white py-6 shadow-md">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <h1 class="text-4xl font-semibold">Portofolio Desain Grafis</h1>
      <p class="text-blue-100 mt-2">Kholifah Maulana Akhsan</p>
    </div>
  </header>

  <!-- Gallery -->
  <main class="py-10 px-4 max-w-7xl mx-auto">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <div><img src="1.jpg" alt="Design 1" class="rounded-lg shadow-md hover:shadow-xl cursor-pointer transition border-4 border-blue-100" onclick="openModal(0)"></div>
      <div><img src="2.jpg" alt="Design 2" class="rounded-lg shadow-md hover:shadow-xl cursor-pointer transition border-4 border-blue-100" onclick="openModal(1)"></div>
      <div><img src="3.jpg" alt="Design 3" class="rounded-lg shadow-md hover:shadow-xl cursor-pointer transition border-4 border-blue-100" onclick="openModal(2)"></div>
      <div><img src="4.jpg" alt="Design 4" class="rounded-lg shadow-md hover:shadow-xl cursor-pointer transition border-4 border-blue-100" onclick="openModal(3)"></div>
      <div><img src="5.jpg" alt="Design 5" class="rounded-lg shadow-md hover:shadow-xl cursor-pointer transition border-4 border-blue-100" onclick="openModal(4)"></div>
      <div><img src="6.jpg" alt="Design 6" class="rounded-lg shadow-md hover:shadow-xl cursor-pointer transition border-4 border-blue-100" onclick="openModal(5)"></div>
    </div>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="fixed inset-0 bg-black bg-opacity-90 hidden items-center justify-center z-50">
    <button onclick="closeModal()" class="absolute top-5 right-6 text-white text-4xl font-bold hover:text-blue-400 transition">&times;</button>
    <button onclick="prevImage()" class="absolute left-4 text-blue-400 text-4xl hover:text-blue-200 transition">&#10094;</button>
    <img id="lightboxImage" src="" alt="Full View" class="max-w-[90%] max-h-[80%] rounded-lg shadow-xl transition duration-300" />
    <button onclick="nextImage()" class="absolute right-4 text-blue-400 text-4xl hover:text-blue-200 transition">&#10095;</button>
  </div>

  <!-- Footer -->
  <footer class="bg-blue-600 text-blue-100 mt-16 text-center text-sm py-4">
    &copy; 2025 Akhsan Desain Grafis - Dibuat dengan ❤️ dan Tailwind CSS
  </footer>

  <script>
    const images = [
      "1.jpg",
      "2.jpg",
      "3.jpg",
      "4.jpg",
      "5.jpg",
      "6.jpg",
    ];

    let currentIndex = 0;

    function openModal(index) {
      currentIndex = index;
      document.getElementById("lightboxImage").src = images[currentIndex];
      document.getElementById("lightbox").classList.remove("hidden");
      document.getElementById("lightbox").classList.add("flex");
    }

    function closeModal() {
      document.getElementById("lightbox").classList.remove("flex");
      document.getElementById("lightbox").classList.add("hidden");
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % images.length;
      document.getElementById("lightboxImage").src = images[currentIndex];
    }

    function prevImage() {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      document.getElementById("lightboxImage").src = images[currentIndex];
    }
  </script>

</body>
</html>
